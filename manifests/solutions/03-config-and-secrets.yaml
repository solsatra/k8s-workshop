# Reference answer for exercise 3 — facilitator eyes only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: snake-config
  namespace: alice
data:
  GRID_SIZE: "20"
  TICK_MS: "120"
  PLAYER_NAME: "alice"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: alice
type: Opaque
stringData:
  DB_HOST: "db-external"
  DB_PORT: "5432"
  DB_USER: "workshop"
  DB_PASSWORD: "REPLACE_WITH_REAL_PASSWORD"
  DB_NAME: "scoreboard"
---
