# Reference answer for exercise 8 — facilitator eyes only.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: snake-core
  namespace: alice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: snake-core
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
