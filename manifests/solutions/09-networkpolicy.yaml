# Reference answer for exercise 9 — facilitator eyes only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: leaderboard-api-restrict
  namespace: alice
spec:
  podSelector:
    matchLabels:
      app: leaderboard-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: snake-core
      ports:
        - protocol: TCP
          port: 8080
