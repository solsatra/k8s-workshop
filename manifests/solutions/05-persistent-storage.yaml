# Reference answer for exercise 5 — facilitator eyes only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: alice
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: vsan-default-storage-policy
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: alice
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: alice
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# Patch on snake-core's ConfigMap so it knows where redis is:
#
# data:
#   REDIS_HOST: "redis"
#   REDIS_PORT: "6379"
