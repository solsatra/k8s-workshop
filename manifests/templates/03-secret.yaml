# Exercise 3 — the Secret you'll actually wire up in exercise 4, once
# leaderboard-api exists. DB_HOST points at the in-namespace Service you'll
# create in exercise 4 (04-db-external-service.yaml), not at the VM
# directly — that indirection is the point of that exercise. Your
# facilitator gives you the real DB_USER/DB_PASSWORD/DB_NAME for the shared
# scoreboard VM — never commit real credentials to git, even in a workshop
# repo.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: <player>   # TODO
type: Opaque
stringData:
  DB_HOST: "db-external"
  DB_PORT: "5432"
  DB_USER: "<TODO-from-facilitator>"
  DB_PASSWORD: "<TODO-from-facilitator>"
  DB_NAME: "<TODO-from-facilitator>"
